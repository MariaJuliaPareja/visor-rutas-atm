name: Integracion

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Revision estatica
        run: ruff check src tests
      - name: Pruebas
        run: pytest -q
      - name: Corrida de humo con sampler simulado
        env:
          RUTAS_SAMPLER: simulado
          RUTAS_NUM_READS: "20"
          RUTAS_DIR_SALIDA: salidas
        run: |
          PYTHONPATH=src python -m rutas_atm --cajeros 4 --corridas 1
          PYTHONPATH=src python -m rutas_atm --validar "$(ls salidas/*.json | head -1)"

  web:
    name: Visor web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npm test
      - name: Construccion
        run: npm run build
